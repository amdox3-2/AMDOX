<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMDOX | Talent Directory</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        .directory-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .directory-header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 0.8s ease-out;
        }

        .directory-header h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .search-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 8px;
            display: flex;
            max-width: 600px;
            margin: 0 auto 40px;
            box-shadow: var(--card-shadow);
        }

        .search-container input {
            border: none;
            background: transparent;
            padding: 15px 20px;
            flex: 1;
            font-size: 1.1rem;
        }

        .search-container input:focus {
            box-shadow: none;
        }

        .seekers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .seeker-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: 0.3s;
            border: 1px solid #f1f5f9;
            position: relative;
            overflow: hidden;
        }

        .seeker-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--card-shadow);
        }

        .seeker-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .seeker-avatar {
            width: 60px;
            height: 60px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .skills-tag {
            display: inline-block;
            background: #f1f5f9;
            color: #475569;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin: 4px;
            font-weight: 600;
        }

        .resume-status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .status-ready { background: #dcfce7; color: #166534; }
        .status-none { background: #fee2e2; color: #991b1b; }

        .back-nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }
    </style>
</head>

<body>
    <div class="directory-container">
        <div class="back-nav">
            <a href="dashboard.html" class="nav-btn" style="color: var(--secondary); text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                <i class='bx bx-arrow-back'></i> Dashboard
            </a>
            <a href="employers-list.html" class="nav-btn" style="color: var(--primary); text-decoration: none; font-weight: 700;">Employer Directory →</a>
        </div>

        <div class="directory-header">
            <h1>Talent Ecosystem</h1>
            <p style="color: var(--secondary); font-size: 1.25rem;">Discover top-tier developers, designers, and visionaries from around the globe.</p>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search by name, expertise, or stack...">
            <button class="primary-btn" style="border-radius: 14px; padding: 0 25px;"><i class='bx bx-search'></i></button>
        </div>

        <div id="loading" style="text-align: center; padding: 40px; color: var(--secondary);">
            <i class='bx bx-loader-alt bx-spin' style="font-size: 3rem; margin-bottom: 10px;"></i>
            <p>Scanning talent pool...</p>
        </div>

        <div class="seekers-grid" id="seekersGrid"></div>

        <div id="noResults" style="display: none; text-align: center; padding: 80px 0;">
            <i class='bx bx-search-alt-2' style="font-size: 4rem; color: #cbd5e1; margin-bottom: 20px;"></i>
            <h3>No profiles found</h3>
            <p style="color: var(--secondary);">Try adjusting your filters or search terms.</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="seekers-list.js"></script>
</body>

</html>
