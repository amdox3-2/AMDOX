<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMDOX | Account Settings</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        .settings-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 550px;
            animation: fadeIn 0.8s ease-out;
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--secondary);
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-btn:hover {
            color: var(--primary);
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h2 {
            font-size: 1.75rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .info-box {
            background: rgba(99, 102, 241, 0.05);
            border-left: 4px solid var(--primary);
            padding: 16px;
            border-radius: 12px;
            margin: 24px 0;
            font-size: 0.875rem;
            color: #475569;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .info-box i {
            font-size: 1.25rem;
            color: var(--primary);
        }
    </style>
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
    <div class="settings-card">
        <div class="nav-links">
            <a href="#" id="backToProfile" class="nav-btn"><i class='bx bx-arrow-back'></i> Return to Profile</a>
            <a href="dashboard.html" class="nav-btn"><i class='bx bxs-dashboard'></i> Dashboard</a>
        </div>

        <div class="form-header">
            <h2>Account Credentials</h2>
            <p style="color: var(--secondary);">Manage your workspace identity and access</p>
        </div>

        <form id="credentialsForm">
            <div class="input-wrap">
                <label>Display Name</label>
                <input type="text" id="accName" placeholder="Legal full name" required>
            </div>
            
            <div class="input-wrap">
                <label>Login Email Address</label>
                <input type="email" id="accEmail" placeholder="Primary workspace email" required>
            </div>

            <div class="info-box">
                <i class='bx bx-info-circle'></i>
                <p>Modifying your email will update your login credentials for future sessions.</p>
            </div>

            <button type="submit" class="primary-btn" style="width: 100%;">Apply Changes</button>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:3000/api';
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');

        if (!currentUser.userId) {
            window.location.href = 'index.html';
        }

        // Set dynamic back link
        const backLink = document.getElementById('backToProfile');
        backLink.href = currentUser.role === 'employer' ? 'employer-profile.html' : 'seeker-profile.html';

        // Pre-fill fields
        document.getElementById('accName').value = currentUser.name || '';
        document.getElementById('accEmail').value = currentUser.email || '';

        document.getElementById('credentialsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('accName').value;
            const email = document.getElementById('accEmail').value;

            try {
                const response = await fetch(`${API_BASE_URL}/auth/update-profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.userId,
                        name: name,
                        email: email
                    })
                });

                const result = await response.json();
                if (result.success) {
                    sessionStorage.setItem('currentUser', JSON.stringify(result.data));
                    alert('Security credentials updated successfully.');
                    window.location.href = backLink.href;
                } else {
                    alert(result.message || 'Verification failed');
                }
            } catch (error) {
                console.error('Update error:', error);
                alert('Connection failure. Please try again later.');
            }
        });
    </script>
</body>

</html>
