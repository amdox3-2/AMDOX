<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMDOX | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class='bx bxs-briefcase-alt-2'></i>
                <span>AMDOX</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-tab="overview">
                    <i class='bx bx-grid-alt'></i>
                    <span>Overview</span>
                </a>
                <a href="#" class="nav-item employer-only" data-tab="my-jobs">
                    <i class='bx bx-list-ul'></i>
                    <span>My Job Listings</span>
                </a>
                <a href="#" class="nav-item seeker-only" data-tab="find-jobs">
                    <i class='bx bx-search'></i>
                    <span>Find Jobs</span>
                </a>
                <a href="#" class="nav-item seeker-only" data-tab="my-apps">
                    <i class='bx bx-send'></i>
                    <span>My Applications</span>
                </a>
                <a href="#" class="nav-item" id="navProfile">
                    <i class='bx bx-user'></i>
                    <span>Profile</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" id="logoutBtn">
                    <i class='bx bx-log-out'></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="user-welcome">
                    <h2 id="welcomeText"><i class='bx bx-sun'></i> Welcome back, User!</h2>
                    <p id="roleBadge" class="badge">Job Seeker</p>
                </div>

                <div class="header-search" style="flex: 1; max-width: 400px; margin: 0 40px; position: relative;">
                    <i class='bx bx-search'
                        style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--secondary);"></i>
                    <input type="text" placeholder="Quick search..."
                        style="width: 100%; padding: 10px 15px 10px 45px; border-radius: 12px; border: 1px solid var(--border-color); background: #f8fafc; outline: none;">
                </div>

                <div class="header-actions">
                    <div id="employerActions" style="display: none;">
                        <button class="primary-btn-sm" onclick="window.location.href='post-job.html'">
                            <i class='bx bx-plus'></i> Post New Job
                        </button>
                    </div>
                    <div class="user-profile-mini"
                        style="display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 5px 15px; border-radius: 12px; background: #f1f5f9;">
                        <i class='bx bxs-user-circle' style="font-size: 2rem; color: var(--primary);"></i>
                        <span id="headerUserName" style="font-weight: 600; font-size: 0.9rem;">User Name</span>
                    </div>
                </div>
            </header>

            <div class="content-area">
                <!-- Overview Tab -->
                <section id="overviewTab" class="tab-content active">
                    <div class="overview-layout">
                        <div class="overview-main">
                            <div class="stats-grid" id="statsGrid">
                                <!-- Stats cards will be dynamic -->
                            </div>
                            <div class="analytics-card"
                                style="background: white; padding: 32px; border-radius: 24px; box-shadow: var(--card-shadow); margin-bottom: 40px; border: 1px solid var(--border-color);">
                                <h3 style="margin-bottom: 20px;">Job Market Insights</h3>
                                <canvas id="analyticsChart" height="200"></canvas>
                            </div>
                        </div>

                        <div class="overview-side">
                            <div class="recent-activity"
                                style="background: white; padding: 32px; border-radius: 24px; box-shadow: var(--card-shadow); border: 1px solid var(--border-color);">
                                <h3 id="recentTitle">Recent Activity</h3>
                                <div class="list-container" id="recentList">
                                    <!-- Items will be dynamic -->
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- My Jobs Tab (Employer) -->
                <section id="myJobsTab" class="tab-content">
                    <div class="section-header">
                        <h3>Your Job Listings</h3>
                    </div>
                    <div class="jobs-list" id="employerJobsList"></div>
                </section>

                <!-- Find Jobs Tab (Seeker) -->
                <section id="findJobsTab" class="tab-content">
                    <div class="search-filters">
                        <input type="text" id="jobSearchInput" placeholder="Search by title or keywords...">
                        <input type="text" id="locationFilter" placeholder="Location...">
                        <select id="typeFilter">
                            <option value="">All Types</option>
                            <option value="Full-time">Full-time</option>
                            <option value="Part-time">Part-time</option>
                            <option value="Remote">Remote</option>
                        </select>
                    </div>
                    <div class="jobs-grid" id="availableJobsGrid"></div>
                </section>

                <!-- My Applications Tab (Seeker) -->
                <section id="myAppsTab" class="tab-content">
                    <div class="section-header">
                        <h3>Your Applications</h3>
                    </div>
                    <div class="apps-list" id="seekerAppsList"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- Job Details Modal -->
    <div id="jobModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="jobModalBody"></div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
