<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMDOX | Create Job Listing</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        .post-job-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 50px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            animation: fadeIn 0.8s ease-out;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .full-width {
            grid-column: span 2;
        }

        .page-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--secondary);
            font-weight: 700;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .back-btn:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }
    </style>
</head>

<body style="padding: 24px;">
    <div class="post-job-container">
        <a href="dashboard.html" class="back-btn"><i class='bx bx-arrow-back'></i> Exit to Dashboard</a>
        
        <div class="page-header">
            <h1>Create Opportunity</h1>
            <p style="color: var(--secondary); font-size: 1.1rem;">Reach thousands of qualified candidates across our global network</p>
        </div>

        <form id="postJobForm" class="form-grid">
            <div class="input-wrap full-width">
                <label>Job Title</label>
                <input type="text" id="jobTitle" placeholder="e.g. Senior Product Designer" required>
            </div>

            <div class="input-wrap">
                <label>Location</label>
                <input type="text" id="location" placeholder="e.g. Bengaluru, India (or Hybrid)" required>
            </div>

            <div class="input-wrap">
                <label>Job Classification</label>
                <select id="jobType">
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Contract">Contract</option>
                    <option value="Internship">Internship</option>
                    <option value="Remote">Remote</option>
                </select>
            </div>

            <div class="input-wrap full-width">
                <label>Compensation Package</label>
                <input type="text" id="salaryRange" placeholder="e.g. ₹12,00,000 - ₹18,00,000 LPA" required>
            </div>

            <div class="input-wrap full-width">
                <label>Detailed Role Description</label>
                <textarea id="description" placeholder="Specify the core mission and expectations..." required></textarea>
            </div>

            <div class="input-wrap">
                <label>Required Qualifications</label>
                <textarea id="qualifications" placeholder="Skills, experience, and education..." required></textarea>
            </div>

            <div class="input-wrap">
                <label>Key Responsibilities</label>
                <textarea id="responsibilities" placeholder="Daily impact and deliverables..." required></textarea>
            </div>

            <div class="full-width" style="margin-top: 20px;">
                <button type="submit" class="primary-btn" style="width: 100%; padding: 18px;">
                    <i class='bx bx-paper-plane'></i> Publish to Global Talent Pool
                </button>
            </div>
        </form>
    </div>

    <script src="config.js"></script>
    <script>
        const API_BASE_URL = window.APP_CONFIG.API_BASE_URL;
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');

        if (currentUser.role !== 'employer') {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('postJobForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const jobData = {
                employer: currentUser.userId,
                title: document.getElementById('jobTitle').value,
                location: document.getElementById('location').value,
                jobType: document.getElementById('jobType').value,
                salaryRange: document.getElementById('salaryRange').value,
                description: document.getElementById('description').value,
                qualifications: document.getElementById('qualifications').value,
                responsibilities: document.getElementById('responsibilities').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/jobs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jobData)
                });

                const result = await response.json();
                if (result.success) {
                    alert('Opportunity successfully published.');
                    window.location.href = 'dashboard.html';
                } else {
                    alert(result.message || 'Validation error');
                }
            } catch (error) {
                alert('Publishing service unavailable.');
            }
        });
    </script>
</body>

</html>
